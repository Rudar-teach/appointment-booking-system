<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Providers - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { animation: { 'fade-in': 'fadeIn 0.3s ease-out' }, keyframes: { fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } } } } } }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); }
    .dark .glass { background: rgba(17,24,39,0.7); }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav class="fixed top-0 w-full z-40 glass">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-sm">BE</div>
          <span class="text-xl font-bold">BookEase</span>
        </a>
        <span class="text-sm text-gray-500">| Provider Management</span>
      </div>
      <a href="/admin.html" class="px-4 py-2 text-sm hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition">← Dashboard</a>
    </div>
  </nav>

  <main class="pt-24 pb-16 container mx-auto px-4">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold">Providers & Services</h1>
      <button onclick="showAddProviderModal()" class="px-6 py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700 transition">+ Add Provider</button>
    </div>

    <div id="providers-container" class="space-y-8">
      <div class="text-center py-20"><div class="loading-spinner mx-auto mb-4"></div><p>Loading providers...</p></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    async function checkAuth() {
      try {
        const data = await api('/auth/me');
        if (!data.user || data.user.role !== 'admin') location.href = '/login.html';
      } catch (e) { location.href = '/login.html'; }
    }

    async function loadProviders() {
      try {
        const data = await api('/admin/providers');
        const providers = data.providers;

        if (providers.length === 0) {
          document.getElementById('providers-container').innerHTML = '<p class="text-center text-gray-500 py-20">No providers yet</p>';
          return;
        }

        document.getElementById('providers-container').innerHTML = providers.map(p => {
          const typeEmoji = { salon: '💇', clinic: '🏥', tutor: '📚', turf: '⚽' };
          return `
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 animate-fade-in">
              <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-3xl">${typeEmoji[p.type] || '📋'}</div>
                  <div>
                    <h3 class="text-xl font-bold">${p.name}</h3>
                    <p class="text-sm text-gray-500 capitalize">${p.type} | Owner: ${p.owner_name || 'N/A'}</p>
                    <p class="text-sm text-gray-500">${p.address || 'No address'} | Bookings: ${p.booking_count} | Services: ${p.service_count}</p>
                  </div>
                </div>
                <span class="text-yellow-500">${'★'.repeat(Math.round(p.rating_avg))} ${p.rating_avg.toFixed(1)}</span>
              </div>

              <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
                <h4 class="font-semibold mb-2">Services</h4>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  ${p.services.map(s => `
                    <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4">
                      <div class="font-medium">${s.name}</div>
                      <div class="text-sm text-gray-600 dark:text-gray-300">${s.duration_min} min | ${formatCurrency(s.price_cents)}</div>
                      ${s.description ? `<div class="text-xs text-gray-500 mt-1">${s.description}</div>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        showToast('Failed to load providers', 'error');
      }
    }

    async function showAddProviderModal() {
      const name = prompt('Provider name:');
      if (!name) return;
      const type = prompt('Type (salon/clinic/tutor/turf):') || 'salon';

      try {
        await api('/admin/providers', { method: 'POST', body: { name, type } });
        showToast('Provider added', 'success');
        loadProviders();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function logout() {
      try { await api('/auth/logout', { method: 'POST' }); location.href = '/login.html'; }
      catch (e) { showToast('Logout failed', 'error'); }
    }

    initDarkMode();
    checkAuth();
    loadProviders();
  </script>
</body>
</html>
